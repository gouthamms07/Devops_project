---
- name: Install dependencies on all nodes
  hosts: all
  become: yes
  tasks:

    - name: Update apt
      apt:
        update_cache: yes

    - name: Install dependencies
      apt:
        name:
          - docker.io
          - containerd
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present

    # 🔥 FIXED containerd config (VERY IMPORTANT)
    - name: Configure containerd properly
      shell: |
        mkdir -p /etc/containerd
        containerd config default > /etc/containerd/config.toml
        sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
        systemctl restart containerd
        systemctl enable containerd

    - name: Enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Disable swap
      command: swapoff -a

    - name: Remove swap from fstab
      replace:
        path: /etc/fstab
        regexp: '^.*swap.*$'
        replace: ''

    - name: Load kernel module
      modprobe:
        name: br_netfilter
        state: present

    - name: Set sysctl params
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.ipv4.ip_forward = 1

    - name: Apply sysctl
      command: sysctl --system


# =========================
# INSTALL KUBERNETES
# =========================
- name: Install Kubernetes tools
  hosts: all
  become: yes
  tasks:

    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory

    - name: Download Kubernetes key
      get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.29/deb/Release.key
        dest: /tmp/k8s.key

    - name: Convert key to gpg
      shell: |
        gpg --dearmor --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/k8s.key

    - name: Add repo
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: |
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.29/deb/ /

    - name: Update apt
      apt:
        update_cache: yes

    - name: Install kube tools
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: Enable kubelet
      systemd:
        name: kubelet
        enabled: yes
        state: started


# =========================
# MASTER
# =========================
- name: Initialize Kubernetes Master
  hosts: master
  become: yes
  tasks:

    # 🔥 IMPORTANT (clean state)
    - name: Reset cluster if exists
      shell: kubeadm reset -f
      ignore_errors: yes

    - name: Restart kubelet
      systemd:
        name: kubelet
        state: restarted

    - name: Initialize cluster
      command: kubeadm init --pod-network-cidr=192.168.0.0/16
      register: init_output

    - name: Save join command
      set_fact:
        join_command: "{{ init_output.stdout_lines | select('search','kubeadm join') | list | first }}"

    - name: Create kube dir
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu

    - name: Copy kubeconfig
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: yes
        owner: ubuntu
        group: ubuntu

    # 🔥 FIXED wait (NO FAIL)
    - name: Wait for API
      shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        for i in {1..30}; do
          kubectl get nodes && exit 0
          echo "Waiting..."
          sleep 10
        done
        exit 1

    - name: Install Calico
      shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl apply -f https://docs.projectcalico.org/manifests/calico.yaml

# =========================
# WORKER JOIN
# =========================
- name: Join Worker Node
  hosts: worker
  become: yes
  tasks:

    - name: Get join command from master
      delegate_to: "{{ groups['master'][0] }}"
      run_once: true
      shell: kubeadm token create --print-join-command
      register: join_cmd

    - name: Debug join command
      debug:
        msg: "{{ join_cmd.stdout }}"

    - name: Join cluster
      shell: "{{ join_cmd.stdout }} --ignore-preflight-errors=all"
